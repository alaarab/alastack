# Production deploy for alastack.com, run by gitboy.dev (see github.com/alaarab/infra).
#
# GitHub is this repo's main home. gitboy-sync on Jets fast-forwards gitboy.dev from GitHub within
# about 30 s, and a new main there runs this job on the Jets deploy runner. The job only asks the
# server to deploy the commit: alastack builds it with its pinned Bun (arm64), switches
# ~/apps/alastack/current, health-checks, and rolls back by itself on failure.
# Roll back by hand: gitboy.dev/alaarab/alastack -> Environments -> production -> Redeploy.
#
# DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS are protected repository variables on gitboy, so only
# protected main gets them. The key can only say "deploy <commit>" for this app.
stages: [deploy]

deploy_production:
  stage: deploy
  tags: [deploy]
  rules:
    - if: '$GITBOY_PIPELINE_SOURCE == "push" && $GITBOY_REF_NAME == "main"'
  timeout: 20 minutes
  environment:
    name: production
    url: https://alastack.com
  variables:
    DEPLOY_TARGET: alaarab@95.216.172.145
    DEPLOY_PORT: "22"
  script:
    - k="$(mktemp)" && trap 'rm -f "$k"' EXIT && printf '%s\n' "$(cat "$DEPLOY_SSH_KEY")" >"$k"
    - ssh -i "$k" -p "$DEPLOY_PORT" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$DEPLOY_KNOWN_HOSTS" -o LogLevel=ERROR "$DEPLOY_TARGET" "deploy $GITBOY_SHA"
